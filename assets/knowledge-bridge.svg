<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3f6e77"/>
    </marker>
  </defs>

  <!-- Question bubble -->
  <rect x="20" y="70" width="200" height="160" rx="16" fill="#1a2b4e" filter="url(#shadow)"/>
  <text x="120" y="115" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500">AI asks:</text>
  <text x="120" y="145" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="15" font-style="italic" opacity="0.9">"How does</text>
  <text x="120" y="168" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="15" font-style="italic" opacity="0.9">Symfony routing</text>
  <text x="120" y="191" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="15" font-style="italic" opacity="0.9">work?"</text>

  <!-- Arrow to bridge -->
  <line x1="230" y1="150" x2="290" y2="150" stroke="#3f6e77" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Knowledge Bridge box -->
  <rect x="300" y="20" width="320" height="260" rx="12" fill="white" stroke="#3f6e77" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="300" y="20" width="320" height="44" rx="12" fill="#3f6e77"/>
  <rect x="300" y="40" width="320" height="24" fill="#3f6e77"/>
  <text x="460" y="50" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">Knowledge Bridge</text>

  <!-- Pipeline steps -->
  <rect x="325" y="80" width="270" height="36" rx="6" fill="rgba(63, 110, 119, 0.08)"/>
  <text x="340" y="103" fill="#3f6e77" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">1.</text>
  <text x="365" y="103" fill="#1a2b4e" font-family="IBM Plex Sans, sans-serif" font-size="14">Query Enhancement (LLM)</text>

  <text x="460" y="128" text-anchor="middle" fill="#3f6e77" font-size="14">&#8595;</text>

  <rect x="325" y="132" width="270" height="36" rx="6" fill="rgba(63, 110, 119, 0.08)"/>
  <text x="340" y="155" fill="#3f6e77" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">2.</text>
  <text x="365" y="155" fill="#1a2b4e" font-family="IBM Plex Sans, sans-serif" font-size="14">Multi-Query Retrieval</text>

  <text x="460" y="180" text-anchor="middle" fill="#3f6e77" font-size="14">&#8595;</text>

  <rect x="325" y="184" width="270" height="36" rx="6" fill="rgba(63, 110, 119, 0.08)"/>
  <text x="340" y="207" fill="#3f6e77" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">3.</text>
  <text x="365" y="207" fill="#1a2b4e" font-family="IBM Plex Sans, sans-serif" font-size="14">Reranking (LLM)</text>

  <text x="460" y="232" text-anchor="middle" fill="#3f6e77" font-size="14">&#8595;</text>

  <rect x="325" y="236" width="270" height="36" rx="6" fill="rgba(63, 110, 119, 0.08)"/>
  <text x="340" y="259" fill="#3f6e77" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">4.</text>
  <text x="365" y="259" fill="#1a2b4e" font-family="IBM Plex Sans, sans-serif" font-size="14">Synthesis with Sources</text>

  <!-- Arrow to answer -->
  <line x1="630" y1="150" x2="690" y2="150" stroke="#3f6e77" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Answer box -->
  <rect x="700" y="70" width="180" height="160" rx="16" fill="#3f6e77" filter="url(#shadow)"/>
  <text x="790" y="120" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500">Synthesized</text>
  <text x="790" y="145" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500">answer with</text>
  <text x="790" y="170" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500">sources</text>
  <text x="790" y="205" text-anchor="middle" fill="white" font-family="IBM Plex Sans, sans-serif" font-size="28">&#x1f4cb;</text>
</svg>
